  #       - asset: fonts/NotoSansEthiopic-Regular.ttf
  #       - asset: fonts/NotoSansEthiopic-Medium.ttf
  #         weight: 500
  #       - asset: fonts/NotoSansEthiopic-Bold.ttf
  #         weight: 700
